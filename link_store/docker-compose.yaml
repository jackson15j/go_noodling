services:
  app:
    # docker compose up --force-recreate -V --build
    container_name: link-store
    build:
      context: .
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - bin/
            - LICENSE
            - README.org
    ports:
      - "${LINK_STORE_PORT:-8080}:8080"
    restart: unless-stopped
    volumes:
      - "${LINK_STORE_PATH:-./data}/:/data"
    networks:
      - go_noodling

networks:
  go_noodling:
